[package]
name = "app-core"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "scan"
path = "src/main.rs"

[dependencies]
core-io = { path = "../core-io" }
disk-layout = { path = "../disk-layout" }
fs-ntfs = { path = "../fs-ntfs" }
result-store = { path = "../result-store" }
carver = { path = "../carver" }
tokio.workspace = true
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
